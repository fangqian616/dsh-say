<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="480" viewBox="0 0 1280 480" role="img" aria-label="dsh-voice 閳?give your DSH agent a voice">
  <title>dsh-voice</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1f3a"/>
      <stop offset="0.55" stop-color="#122c52"/>
      <stop offset="1" stop-color="#1b3f8f"/>
    </linearGradient>
    <linearGradient id="wave" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2563eb"/>
      <stop offset="0.5" stop-color="#7aa8f7"/>
      <stop offset="1" stop-color="#2563eb"/>
    </linearGradient>
  </defs>

  <rect width="1280" height="480" fill="url(#bg)"/>

  <!-- a quiet grid, so the panel does not read as a flat rectangle -->
  <g stroke="#ffffff" stroke-opacity="0.05" stroke-width="1">
    <path d="M0 96H1280M0 192H1280M0 288H1280M0 384H1280"/>
    <path d="M160 0V480M320 0V480M480 0V480M640 0V480M800 0V480M960 0V480M1120 0V480"/>
  </g>

  <!-- waveform: the product, drawn rather than described. Two passes with no
       filter: a wide translucent stroke for the glow, the lit stroke on top. -->
  <g transform="translate(58 240)">
    <g stroke="#2563eb" stroke-opacity="0.35" stroke-width="22" stroke-linecap="round">
      <path d="M0 0h18"/>
      <path d="M38 -18v36"/>
      <path d="M62 -40v80"/>
      <path d="M86 -68v136"/>
      <path d="M110 -34v68"/>
      <path d="M134 -92v184"/>
      <path d="M158 -52v104"/>
      <path d="M182 -14v28"/>
      <path d="M206 -76v152"/>
      <path d="M230 -30v60"/>
      <path d="M254 -58v116"/>
      <path d="M278 -20v40"/>
      <path d="M302 -44v88"/>
      <path d="M326 -10v20"/>
    </g>
    <g stroke="url(#wave)" stroke-width="7" stroke-linecap="round">
      <path d="M0 0h18"/>
      <path d="M38 -18v36"/>
      <path d="M62 -40v80"/>
      <path d="M86 -68v136"/>
      <path d="M110 -34v68"/>
      <path d="M134 -92v184"/>
      <path d="M158 -52v104"/>
      <path d="M182 -14v28"/>
      <path d="M206 -76v152"/>
      <path d="M230 -30v60"/>
      <path d="M254 -58v116"/>
      <path d="M278 -20v40"/>
      <path d="M302 -44v88"/>
      <path d="M326 -10v20"/>
    </g>
  </g>

  <g font-family="Segoe UI, Helvetica Neue, Arial, sans-serif">
    <text x="470" y="188" fill="#ffffff" font-size="78" font-weight="700" letter-spacing="-1.5">dsh-voice</text>
    <text x="472" y="240" fill="#7aa8f7" font-size="32" font-weight="600">Give your DSH agent a voice.</text>
    <text x="472" y="288" fill="#c9d8ee" font-size="24">Speak and report out loud, in a voice you pick.</text>
    <g font-family="Cascadia Code, Consolas, monospace" font-size="20" fill="#8aa0b8">
      <text x="472" y="344">$ dsh plugin --profile web add dsh-voice</text>
    </g>
  </g>

  <g font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="18" font-weight="600">
    <rect x="472" y="372" width="122" height="34" rx="17" fill="#ffffff" fill-opacity="0.07" stroke="#7aa8f7" stroke-opacity="0.5"/>
    <text x="533" y="395" fill="#c9d8ee" text-anchor="middle">MIT</text>

    <rect x="608" y="372" width="188" height="34" rx="17" fill="#ffffff" fill-opacity="0.07" stroke="#7aa8f7" stroke-opacity="0.5"/>
    <text x="702" y="395" fill="#c9d8ee" text-anchor="middle">no download</text>

    <rect x="810" y="372" width="176" height="34" rx="17" fill="#ffffff" fill-opacity="0.07" stroke="#7aa8f7" stroke-opacity="0.5"/>
    <text x="898" y="395" fill="#c9d8ee" text-anchor="middle">system voices</text>

    <rect x="1000" y="372" width="166" height="34" rx="17" fill="#ffffff" fill-opacity="0.07" stroke="#7aa8f7" stroke-opacity="0.5"/>
    <text x="1083" y="395" fill="#c9d8ee" text-anchor="middle">GPT-SoVITS</text>
  </g>
</svg>
